
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9edf5">
    <title>Paint Studio</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-palette"></i></div>
        <div>
            <h1>Paint Studio</h1>
            <span>Editor de dibujo</span>
        </div>
    </div>

    <div class="top-actions">
        <button id="undoBtn" class="icon-btn" title="Deshacer (Ctrl+Z)">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="redoBtn" class="icon-btn" title="Rehacer (Ctrl+Y)">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
        <span class="separator"></span>
        <button id="openBtn" class="action-btn">
            <i class="fa-solid fa-folder-open"></i> Abrir
        </button>
        <button id="saveBtn" class="action-btn primary-btn">
            <i class="fa-solid fa-download"></i> Guardar PNG
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
</header>

<main class="app-layout">

    <aside class="sidebar">

        <section class="tool-section">
            <h2>Herramientas</h2>

            <div class="tools-grid">
                <button class="tool active" data-tool="pencil" title="Lápiz (P)">
                    <i class="fa-solid fa-pencil"></i><span>Lápiz</span>
                </button>

                <button class="tool" data-tool="brush" title="Pincel (B)">
                    <i class="fa-solid fa-paintbrush"></i><span>Pincel</span>
                </button>

                <button class="tool" data-tool="eraser" title="Borrador (E)">
                    <i class="fa-solid fa-eraser"></i><span>Borrador</span>
                </button>

                <button class="tool" data-tool="fill" title="Rellenar (F)">
                    <i class="fa-solid fa-fill-drip"></i><span>Relleno</span>
                </button>

                <button class="tool" data-tool="line" title="Línea (L)">
                    <i class="fa-solid fa-minus"></i><span>Línea</span>
                </button>

                <button class="tool" data-tool="rect" title="Rectángulo (R)">
                    <i class="fa-regular fa-square"></i><span>Rectángulo</span>
                </button>

                <button class="tool" data-tool="circle" title="Círculo (C)">
                    <i class="fa-regular fa-circle"></i><span>Círculo</span>
                </button>

                <button class="tool" data-tool="ellipse" title="Elipse">
                    <i class="fa-solid fa-ellipsis"></i><span>Elipse</span>
                </button>

                <button class="tool" data-tool="text" title="Texto (T)">
                    <i class="fa-solid fa-font"></i><span>Texto</span>
                </button>

                <button class="tool" data-tool="eyedropper" title="Cuentagotas (I)">
                    <i class="fa-solid fa-eye-dropper"></i><span>Color</span>
                </button>
            </div>
        </section>

        <section class="tool-section">
            <h2>Configuración</h2>

            <label for="sizeInput" class="label-row">
                <span>Tamaño del trazo</span>
                <strong id="sizeValue">5 px</strong>
            </label>
            <input type="range" id="sizeInput" min="1" max="60" value="5">

            <label for="opacityInput" class="label-row">
                <span>Opacidad</span>
                <strong id="opacityValue">100%</strong>
            </label>
            <input type="range" id="opacityInput" min="10" max="100" value="100">

            <label class="check-row">
                <input type="checkbox" id="fillShape">
                Rellenar figuras
            </label>
        </section>

        <section class="tool-section">
            <h2>Colores</h2>

            <div class="color-preview">
                <label class="color-picker-wrap" title="Elegir color">
                    <input type="color" id="colorInput" value="#202938">
                    <i class="fa-solid fa-eye-dropper"></i>
                </label>
                <div>
                    <strong id="hexValue">#202938</strong>
                    <span>Color principal</span>
                </div>
            </div>

            <div class="palette" id="palette">
                <button style="--swatch:#202938" data-color="#202938" title="Negro azulado"></button>
                <button style="--swatch:#ffffff" data-color="#ffffff" title="Blanco"></button>
                <button style="--swatch:#e74c3c" data-color="#e74c3c" title="Rojo"></button>
                <button style="--swatch:#f39c12" data-color="#f39c12" title="Naranja"></button>
                <button style="--swatch:#f1c40f" data-color="#f1c40f" title="Amarillo"></button>
                <button style="--swatch:#2ecc71" data-color="#2ecc71" title="Verde"></button>
                <button style="--swatch:#1abc9c" data-color="#1abc9c" title="Turquesa"></button>
                <button style="--swatch:#3498db" data-color="#3498db" title="Azul"></button>
                <button style="--swatch:#34495e" data-color="#34495e" title="Azul oscuro"></button>
                <button style="--swatch:#9b59b6" data-color="#9b59b6" title="Violeta"></button>
                <button style="--swatch:#e84393" data-color="#e84393" title="Rosa"></button>
                <button style="--swatch:#795548" data-color="#795548" title="Marrón"></button>
                <button style="--swatch:#95a5a6" data-color="#95a5a6" title="Gris"></button>
                <button style="--swatch:#bdc3c7" data-color="#bdc3c7" title="Gris claro"></button>
            </div>

            <label for="canvasColor" class="field-label">Fondo del lienzo</label>
            <input type="color" id="canvasColor" value="#ffffff" class="background-picker">

            <button id="swapColorBtn" class="wide-btn">
                <i class="fa-solid fa-right-left"></i> Usar color de fondo
            </button>
        </section>

        <section class="tool-section">
            <h2>Texto</h2>

            <label for="textInput" class="field-label">Contenido</label>
            <input type="text" id="textInput" placeholder="Escribí tu texto">

            <label for="fontSize" class="field-label">Tamaño de letra</label>
            <input type="number" id="fontSize" value="28" min="8" max="150">

            <label for="fontFamily" class="field-label">Tipografía</label>
            <select id="fontFamily">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="Courier New">Courier New</option>
                <option value="Impact">Impact</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>
            <p class="hint">Seleccioná Texto y hacé clic en el lienzo.</p>
        </section>

        <section class="tool-section">
            <h2>Acciones</h2>

            <button id="clearBtn" class="wide-btn danger-btn">
                <i class="fa-solid fa-trash"></i> Limpiar lienzo
            </button>

            <button id="copyBtn" class="wide-btn">
                <i class="fa-regular fa-copy"></i> Copiar imagen
            </button>
        </section>
    </aside>

    <section class="workspace">
        <div class="canvas-toolbar">
            <div class="canvas-title">
                <i class="fa-regular fa-image"></i>
                <span>Mi dibujo</span>
                <span class="live-dot"></span>
            </div>

            <div class="canvas-actions">
                <button id="zoomOut" title="Alejar">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span id="zoomValue">100%</span>
                <button id="zoomIn" title="Acercar">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="zoomReset" title="Restablecer zoom">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button id="fullscreenBtn" title="Pantalla completa">
                    <i class="fa-solid fa-maximize"></i>
                </button>
            </div>
        </div>

        <div class="canvas-area" id="canvasArea">
            <div class="canvas-frame" id="canvasFrame">
                <canvas id="paintCanvas" width="1200" height="800"></canvas>
            </div>
        </div>

        <div class="statusbar">
            <span id="statusMessage">
                <i class="fa-solid fa-circle-info"></i> Listo para dibujar
            </span>
            <div>
                <span id="canvasDimensions">1200 × 800 px</span>
                <span class="status-divider"></span>
                <span id="cursorPosition">X: 0, Y: 0</span>
            </div>
        </div>
    </section>

</main>

<div id="toast" class="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
